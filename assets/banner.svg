<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Accent Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Node Pulse Keyframes & Animations -->
    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.25); opacity: 1; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-18px) translateX(12px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -80; }
      }
      @keyframes beaconRing {
        0% { r: 10; opacity: 0.9; }
        100% { r: 38; opacity: 0; }
      }
      .node-pulse {
        transform-origin: center;
        animation: pulseNode 3.5s ease-in-out infinite;
      }
      .p-float-1 { animation: floatParticle 6s ease-in-out infinite; }
      .p-float-2 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
      .p-float-3 { animation: floatParticle 7s ease-in-out infinite 3s; }
      .mesh-line {
        stroke-dasharray: 6 6;
        animation: dashFlow 4s linear infinite;
      }
      .beacon {
        animation: beaconRing 2.6s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Outer Card Border -->
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- DYNAMIC / ANIMATED P2P TOPOLOGY MESH (In Background) -->
  <g opacity="0.32">
    <!-- Network Links with Animated Stream Pulses -->
    <line x1="80" y1="90" x2="240" y2="160" stroke="#0284c7" stroke-width="1.5" class="mesh-line" />
    <line x1="240" y1="160" x2="420" y2="80" stroke="#6366f1" stroke-width="1.5" class="mesh-line" />
    <line x1="240" y1="160" x2="310" y2="340" stroke="#38bdf8" stroke-width="1.5" class="mesh-line" />
    <line x1="420" y1="80" x2="600" y2="50" stroke="#818cf8" stroke-width="1.5" class="mesh-line" />
    <line x1="600" y1="50" x2="780" y2="90" stroke="#a855f7" stroke-width="1.5" class="mesh-line" />
    <line x1="780" y1="90" x2="960" y2="150" stroke="#c084fc" stroke-width="1.5" class="mesh-line" />
    <line x1="960" y1="150" x2="1120" y2="80" stroke="#34d399" stroke-width="1.5" class="mesh-line" />
    <line x1="960" y1="150" x2="1040" y2="330" stroke="#10b981" stroke-width="1.5" class="mesh-line" />
    <line x1="310" y1="340" x2="520" y2="360" stroke="#0ea5e9" stroke-width="1.5" class="mesh-line" />
    <line x1="520" y1="360" x2="720" y2="370" stroke="#6366f1" stroke-width="1.5" class="mesh-line" />
    <line x1="720" y1="370" x2="890" y2="340" stroke="#8b5cf6" stroke-width="1.5" class="mesh-line" />
    <line x1="890" y1="340" x2="1040" y2="330" stroke="#059669" stroke-width="1.5" class="mesh-line" />
    <line x1="780" y1="90" x2="720" y2="370" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="420" y1="80" x2="520" y2="360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Animated Mesh Nodes / Beacons (Deep Background Layers) -->
  <g>
    <!-- Node 1 (Top Left) -->
    <circle cx="80" cy="90" r="10" fill="none" stroke="#38bdf8" stroke-width="2" class="beacon" />
    <circle cx="80" cy="90" r="5" fill="#38bdf8" filter="url(#glow)" />

    <!-- Node 2 (Mid Left) -->
    <circle cx="240" cy="160" r="10" fill="none" stroke="#6366f1" stroke-width="2" class="beacon" style="animation-delay: 0.8s;" />
    <circle cx="240" cy="160" r="6" fill="#818cf8" filter="url(#glow)" class="node-pulse" />

    <!-- Node 3 (Top Mid Left) -->
    <circle cx="420" cy="80" r="4" fill="#38bdf8" opacity="0.8" />

    <!-- Node 4 (Top Center) -->
    <circle cx="600" cy="50" r="10" fill="none" stroke="#c084fc" stroke-width="2" class="beacon" style="animation-delay: 1.4s;" />
    <circle cx="600" cy="50" r="6" fill="#a855f7" filter="url(#glow)" />

    <!-- Node 5 (Top Right Mid) -->
    <circle cx="780" cy="90" r="5" fill="#818cf8" opacity="0.9" />

    <!-- Node 6 (Far Right Mid) -->
    <circle cx="960" cy="150" r="10" fill="none" stroke="#34d399" stroke-width="2" class="beacon" style="animation-delay: 1.1s;" />
    <circle cx="960" cy="150" r="7" fill="#10b981" filter="url(#glow)" class="node-pulse" />

    <!-- Node 7 (Far Right Top) -->
    <circle cx="1120" cy="80" r="5" fill="#38bdf8" opacity="0.8" />

    <!-- Node 8 (Bottom Left) -->
    <circle cx="310" cy="340" r="6" fill="#0284c7" opacity="0.85" />

    <!-- Node 9 (Bottom Mid-Left) -->
    <circle cx="520" cy="360" r="5" fill="#6366f1" opacity="0.75" />

    <!-- Node 10 (Bottom Center) -->
    <circle cx="720" cy="370" r="10" fill="none" stroke="#8b5cf6" stroke-width="2" class="beacon" style="animation-delay: 2s;" />
    <circle cx="720" cy="370" r="6" fill="#8b5cf6" filter="url(#glow)" />

    <!-- Node 11 (Bottom Mid-Right) -->
    <circle cx="890" cy="340" r="5" fill="#10b981" opacity="0.75" />

    <!-- Node 12 (Bottom Right) -->
    <circle cx="1040" cy="330" r="6" fill="#34d399" opacity="0.85" />
  </g>

  <!-- Ambient Floating Data Particles -->
  <g opacity="0.6">
    <circle cx="180" cy="110" r="2" fill="#38bdf8" class="p-float-1" />
    <circle cx="510" cy="110" r="2.5" fill="#818cf8" class="p-float-2" />
    <circle cx="860" cy="120" r="2" fill="#c084fc" class="p-float-3" />
    <circle cx="430" cy="310" r="2" fill="#34d399" class="p-float-1" />
    <circle cx="790" cy="310" r="2.5" fill="#38bdf8" class="p-float-2" />
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle & Interactive Pills -->
  <!-- Top Category Badge Pill -->
  <g transform="translate(600, 78)">
    <rect x="-145" y="-16" width="290" height="32" rx="16" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2.5">
      DISTRIBUTED SYSTEMS &amp; P2P
    </text>
  </g>

  <!-- MAIN TITLE (Sharp & Prominent in Foreground) -->
  <!-- Subtle Backing Glow for Main Title -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="900" fill="#38bdf8" opacity="0.15" filter="url(#softGlow)">
    Peer-to-Peer &amp; Distributed Data
  </text>
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
    Peer-to-Peer &amp; Distributed Data
  </text>

  <!-- SUBTITLE (Clear and readable) -->
  <text x="600" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#94a3b8" letter-spacing="0.3">
    Curated Hub for Content Addressing, QUIC Dialing, Decentralized Storage &amp; Local-First CRDTs
  </text>

  <!-- FEATURE TAG PILLS (Foreground Layout - Non-obstructive) -->
  <g transform="translate(180, 260)">
    <!-- Pill 1: IPFS & Bitswap -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="145" height="36" rx="18" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="20" cy="18" r="4.5" fill="#38bdf8" />
      <text x="75" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
        IPFS &amp; Bitswap
      </text>
    </g>

    <!-- Pill 2: QUIC / libp2p / Iroh -->
    <g transform="translate(160, 0)">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="20" cy="18" r="4.5" fill="#818cf8" />
      <text x="85" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
        QUIC &amp; NAT Dialing
      </text>
    </g>

    <!-- Pill 3: BitTorrent & WireGuard -->
    <g transform="translate(340, 0)">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="20" cy="18" r="4.5" fill="#c084fc" />
      <text x="85" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
        BitTorrent &amp; Mesh
      </text>
    </g>

    <!-- Pill 4: Local-First CRDTs -->
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="155" height="36" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="20" cy="18" r="4.5" fill="#34d399" />
      <text x="80" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
        Local-First CRDTs
      </text>
    </g>

    <!-- Pill 5: DePIN Storage -->
    <g transform="translate(690, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="20" cy="18" r="4.5" fill="#fbbf24" />
      <text x="78" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
        DePIN Storage
      </text>
    </g>
  </g>

  <!-- Bottom Ecosystem Footprint Text -->
  <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b" letter-spacing="1">
    SaaS GATEWAYS • OPEN-SOURCE RUNTIMES • DHT PROTOCOLS • ZERO-TRUST NETWORKS
  </text>
</svg>
